# Nur nötig, wenn auf dem Server bereits nginx die Ports 80/443 belegt.
# Datei nach /etc/nginx/sites-available/ kopieren, verlinken, Zertifikat holen:
#   ln -s /etc/nginx/sites-available/nginx-investment-arena.conf /etc/nginx/sites-enabled/
#   certbot --nginx -d investment-arena.com -d www.investment-arena.com
#   nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name investment-arena.com www.investment-arena.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
